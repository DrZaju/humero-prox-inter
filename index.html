<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Húmero proximal | Modelo 3D interactivo</title>

<script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #243447;
    }

    header {
        background: #17324d;
        color: white;
        padding: 18px 24px;
        text-align: center;
    }

    header h1 {
        margin: 0;
        font-size: 23px;
    }

    header p {
        margin: 7px 0 0;
        font-size: 14px;
        color: #dce5ee;
    }

    .container {
        display: flex;
        height: calc(100vh - 94px);
        min-height: 500px;
    }

    .viewer {
        flex: 1;
        min-width: 0;
        background: #e5e9ed;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    .panel {
        width: 290px;
        padding: 22px;
        background: white;
        border-left: 1px solid #ddd;
        overflow-y: auto;
    }

    h2 {
        font-size: 17px;
        margin: 0 0 15px;
    }

    h3 {
        font-size: 14px;
        margin: 24px 0 12px;
        color: #526477;
    }

    button {
        display: block;
        width: 100%;
        padding: 12px;
        margin-bottom: 10px;
        border: 1px solid #cbd5df;
        border-radius: 7px;
        background: #f1f3f5;
        color: #334155;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s;
    }

    button:hover:not(:disabled) {
        background: #dce6ef;
    }

    button.active {
        background: #167347;
        color: white;
        border-color: #167347;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .reset {
        background: #17324d;
        color: white;
        border-color: #17324d;
    }

    .reset:hover:not(:disabled) {
        background: #284d70;
    }

    .status {
        margin-top: 20px;
        padding: 12px;
        background: #eef3f7;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.5;
    }

    @media (max-width: 750px) {
        .container {
            flex-direction: column;
            height: auto;
        }

        .viewer {
            height: 55vh;
            min-height: 350px;
            flex: none;
        }

        .panel {
            width: 100%;
            border-left: none;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Húmero proximal | Modelo 3D interactivo</h1>
    <p>Visualización anatómica para planificación quirúrgica</p>
</header>

<div class="container">

    <div class="viewer">
        <iframe id="api-frame" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe>
    </div>

    <aside class="panel">

        <h2>Control de estructuras</h2>

        <button id="btn-medial" onclick="toggleStructure('medial')" disabled>
            Húmero medial
        </button>

        <button id="btn-lateral" onclick="toggleStructure('lateral')" disabled>
            Húmero lateral
        </button>

        <button id="btn-tumor" onclick="toggleStructure('tumor')" disabled>
            Tumor
        </button>

        <h3>Aislar estructuras</h3>

        <button onclick="isolate('medial')" disabled>
            Solo húmero medial
        </button>

        <button onclick="isolate('lateral')" disabled>
            Solo húmero lateral
        </button>

        <button onclick="isolate('tumor')" disabled>
            Solo tumor
        </button>

        <button class="reset" onclick="showAll()" disabled>
            Mostrar todo
        </button>

        <div class="status" id="status">
            Cargando modelo 3D...
        </div>

    </aside>

</div>

<script>

const MODEL_UID = "a8138671e7894bb9abd2950221cb03c2";

const iframe = document.getElementById("api-frame");

const client = new Sketchfab("1.12.1", iframe);

let api = null;
let ready = false;
let busy = false;

const structures = {
    medial: {
        name: "HumeroMedS",
        id: null,
        visible: true
    },
    lateral: {
        name: "HumeroLatS",
        id: null,
        visible: true
    },
    tumor: {
        name: "HumeroTumS",
        id: null,
        visible: true
    }
};

function setStatus(message) {
    document.getElementById("status").textContent = message;
}

function findGroup(node, name) {

    if (node.name === name && node.type === "Group") {
        return node;
    }

    if (Array.isArray(node.children)) {

        for (const child of node.children) {

            const found = findGroup(child, name);

            if (found) {
                return found;
            }
        }
    }

    return null;
}

function updateButtons() {

    for (const key of Object.keys(structures)) {

        const button = document.getElementById("btn-" + key);

        button.classList.toggle(
            "active",
            structures[key].visible
        );

        button.textContent =
            (structures[key].visible ? "● " : "○ ") +
            (
                key === "medial" ? "Húmero medial" :
                key === "lateral" ? "Húmero lateral" :
                "Tumor"
            );
    }
}

function setControlsEnabled(enabled) {

    document.querySelectorAll("button").forEach(button => {
        button.disabled = !enabled;
    });
}

function applyVisibility(key, visible) {

    return new Promise((resolve, reject) => {

        const structure = structures[key];

        if (structure.id === null) {
            reject(new Error("No se encontró " + structure.name));
            return;
        }

        const callback = function(error) {

            if (error) {
                reject(error);
            } else {
                structure.visible = visible;
                resolve();
            }
        };

        if (visible) {
            api.show(structure.id, callback);
        } else {
            api.hide(structure.id, callback);
        }

    });
}

async function changeVisibility(changes) {

    if (!ready || busy) {
        return;
    }

    busy = true;
    setControlsEnabled(false);

    try {

        // Se ejecutan las operaciones secuencialmente.
        for (const [key, visible] of Object.entries(changes)) {

            await applyVisibility(key, visible);
        }

        updateButtons();

        setStatus("Visibilidad actualizada correctamente.");

    } catch (error) {

        console.error("Error al cambiar visibilidad:", error);

        setStatus(
            "Error al modificar la visibilidad. Consulta la consola."
        );

    } finally {

        busy = false;
        setControlsEnabled(true);
    }
}

function toggleStructure(key) {

    changeVisibility({
        [key]: !structures[key].visible
    });
}

function isolate(key) {

    changeVisibility({
        medial: key === "medial",
        lateral: key === "lateral",
        tumor: key === "tumor"
    });
}

function showAll() {

    changeVisibility({
        medial: true,
        lateral: true,
        tumor: true
    });
}

client.init(MODEL_UID, {

    autostart: 1,
    ui_infos: 0,
    ui_controls: 1,
    ui_stop: 0,

    success: function(instance) {

        api = instance;

        api.start();

        api.addEventListener("viewerready", function() {

            api.getSceneGraph(function(error, graph) {

                if (error || !graph) {

                    console.error(error);

                    setStatus("No fue posible leer la estructura del modelo.");

                    return;
                }

                console.log("Jerarquía Sketchfab:", graph);

                let allFound = true;

                for (const key of Object.keys(structures)) {

                    const structure = structures[key];

                    const node = findGroup(graph, structure.name);

                    if (node) {

                        structure.id = node.instanceID;

                        console.log(
                            structure.name,
                            "ID:",
                            structure.id
                        );

                    } else {

                        allFound = false;

                        console.error(
                            "No encontrado:",
                            structure.name
                        );
                    }
                }

                if (!allFound) {

                    setStatus(
                        "No se encontraron todas las estructuras."
                    );

                    return;
                }

                ready = true;

                updateButtons();

                setControlsEnabled(true);

                setStatus(
                    "Modelo listo. Utiliza los botones para mostrar, ocultar o aislar estructuras."
                );

            });

        });

    },

    error: function() {

        setStatus("Error al cargar el modelo de Sketchfab.");

    }

});

</script>

</body>
</html>
